name: build

# manual only: the build needs access to the Nuxeo LTS 2023 Maven artifacts
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # TestSqsSink is skipped without a LOCALSTACK_AUTH_TOKEN secret
      - run: mvn -B -nsu verify
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
